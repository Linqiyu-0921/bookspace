<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOK SPACE · 书店寻书</title>
  <meta name="description" content="52 本书店寻得的书，以书脊之姿立于一排书架，悬停翻开即见封面。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <div class="stage" id="stage">

    <!-- 巨型背景书名字（悬停时浮现） -->
    <div class="bg-word" id="bgWord" aria-hidden="true"><span></span></div>

    <!-- 顶部角标 -->
    <div class="corner corner-left">
      <div>Reading Archive</div>
      <div class="line2">Bookstore Finds · 2026</div>
    </div>
    <div class="corner corner-right">
      <div id="bookCount">52 Books</div>
    </div>

    <!-- 搜索 -->
    <div class="search-box">
      <input id="searchInput" type="search" placeholder="Search · 书名 / 作者" autocomplete="off" spellcheck="false">
    </div>

    <!-- 标题 -->
    <header class="header">
      <div class="eyebrow">Personal Collection</div>
      <h1 class="title">BOOK SPACE</h1>
    </header>

    <!-- 种类分类筛选 -->
    <nav class="cats" id="cats" aria-label="书籍分类"></nav>

    <!-- 图书说明（位于标题与书架之间的留白带，不遮挡书籍） -->
    <div class="book-info" id="bookInfo" aria-live="polite">
      <div class="bi-tag" id="infoTag"></div>
      <h2 class="bi-title" id="infoTitle"></h2>
      <div class="bi-sub" id="infoSub"></div>
      <div class="bi-meta" id="infoMeta"></div>
      <p class="bi-desc" id="infoDesc"></p>
    </div>

    <!-- 侧边索引 -->
    <aside class="side">
      <span class="side-label">SHELF —— ARCHIVE</span>
      <div class="counter">
        <span id="curIdx">01</span>
        <span class="counter-slash"></span>
        <span id="totalIdx">52</span>
      </div>
    </aside>

    <!-- 书架场景（可横向拖拽 / 滚轮平移） -->
    <div class="shelf-scene" id="scene">
      <div class="shelf-track" id="track">
        <!-- 书籍由 app.js 注入 -->
      </div>
      <div class="empty-hint" id="emptyHint">没有找到匹配的书 · No Matches</div>
    </div>

    <!-- 底部提示 -->
    <div class="footer-hint">Hover to open &nbsp;·&nbsp; Drag to browse</div>
  </div>

  <script src="data.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
